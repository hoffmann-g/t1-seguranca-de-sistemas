[project]
name = "t1-seguranca-de-sistemas"
version = "0.1.0"
description = "Hybrid encryption (AES-GCM + RSA-OAEP + Ed25519) and a man-in-the-middle attack"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
